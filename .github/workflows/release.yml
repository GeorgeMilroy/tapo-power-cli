name: Release binaries

# Builds standalone executables (no Python needed) and attaches them to the
# GitHub release. Triggered by publishing a release in the GitHub UI.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tapo-power.exe
            built: dist/tapo-power.exe
          - os: macos-latest
            asset: tapo-power-macos-arm64
            built: dist/tapo-power
          - os: ubuntu-latest
            asset: tapo-power-linux-x64
            built: dist/tapo-power
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pyinstaller
      - run: >
          pyinstaller --onefile --name tapo-power --console --noconfirm --clean
          --paths src --collect-submodules kasa --collect-submodules tapo --collect-submodules rich
          src/tapo_power/__main__.py
      - name: Smoke test
        run: |
          ${{ matrix.built }} --version
          ${{ matrix.built }} --help > /dev/null
      - run: mv "${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
