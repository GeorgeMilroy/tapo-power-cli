[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-power-cli"
version = "0.1.0"
description = "LLM-friendly CLI to switch TP-Link Tapo smart plugs and switches on/off"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GeorgeMilroy" }]
requires-python = ">=3.11"
dependencies = ["tapo>=0.11.1", "python-kasa>=0.10"]
keywords = ["tapo", "tp-link", "smart-plug", "p100", "p110", "home-automation", "llm", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/GeorgeMilroy/tapo-power-cli"
Issues = "https://github.com/GeorgeMilroy/tapo-power-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tapo-power = "tapo_power.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
